[VDR]
vdr_protocol = http
vdr_ip = <VDRIP>
streamdev_port = 3000
epg_mode = svdrp
;epg_mode = file
svdrp_port = 6419
svdrp_timeout = 30
epg_data_path = /var/lib/vdr/epg.data

[PROXY]
listen_ip = 0.0.0.0
proxy_protocol = http
listen_port = 8080
;proxy_protocol = https
;listen_port = 8443
;ssl_cert_file = /etc/jellyfin-vdr-proxy/cert.pem
;ssl_key_file = /etc/jellyfin-vdr-proxy/privkey.pem
